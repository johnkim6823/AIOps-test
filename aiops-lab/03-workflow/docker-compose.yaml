# Phase 3: n8n (Queue Mode) + Redis + Qdrant + Ollama
#
# n8n 은 main(REST/UI) + worker 2개 컨테이너로 분리하여 Queue Mode 시연.
# Redis 가 큐 백엔드. ollama-pull 은 1회성 init 컨테이너로 모델을 받아오고 종료한다.
#
# 네트워크 구성:
#   - compose 자체 네트워크: redis, qdrant, ollama, n8n*, ollama-pull 끼리 통신
#   - 외부 'kind' 네트워크: kind 클러스터의 control-plane 컨테이너에 접근 가능
#     하도록 n8n / n8n-worker 만 추가 attach. Phase 1 의 kind 클러스터가 떠있어야
#     이 네트워크가 존재. 없으면 docker compose up 이 실패하므로 up.sh 가 사전 체크.
#
# kubeconfig: up.sh 가 'kind get kubeconfig --internal --name aiops-lab' 로 생성한
#   ./n8n-kubeconfig (컨테이너에서 control-plane 호스트명 'aiops-lab-control-plane'
#   로 API 호출 가능) 을 read-only 마운트.

name: aiops-lab

x-n8n-common: &n8n-common
  image: n8nio/n8n:1.61.0
  environment: &n8n-env
    GENERIC_TIMEZONE: ${TIMEZONE:-Asia/Seoul}
    EXECUTIONS_MODE: queue
    QUEUE_BULL_REDIS_HOST: redis
    QUEUE_BULL_REDIS_PORT: 6379
    N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-please-change-me-32-chars-or-more}
    # Lab 편의: 첫 번째 사용자 회원가입 절차 스킵 (운영에서는 제거)
    N8N_USER_MANAGEMENT_DISABLED: "true"
    N8N_DIAGNOSTICS_ENABLED: "false"
    N8N_HIRING_BANNER_ENABLED: "false"
    N8N_RUNNERS_ENABLED: "true"
    N8N_LOG_LEVEL: info
    KUBECONFIG: /home/node/.kube/config
    # 외부 비밀값(.env 에서 로드)
    SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
    SLACK_CHANNEL: ${SLACK_CHANNEL:-#alerts}
    SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
    OLLAMA_BASE_URL: http://ollama:11434
    OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    QDRANT_URL: http://qdrant:6333
    RL_DECIDE_URL: ${RL_DECIDE_URL:-http://rl-stub:8000/decide}
    # K8s API 접근용 (06-n8n-flow/import.sh 가 .env 에 자동 주입)
    K8S_API_URL: ${K8S_API_URL:-https://aiops-lab-control-plane:6443}
    K8S_TOKEN: ${K8S_TOKEN:-}
  volumes:
    - n8n_data:/home/node/.n8n
    - ./n8n-kubeconfig:/home/node/.kube/config:ro
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - default
    - kind
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    container_name: aiops-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks: [default]
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: aiops-qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [default]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.3.10
    container_name: aiops-ollama
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama_data:/root/.ollama
    networks: [default]
    restart: unless-stopped
    # GPU passthrough: VirtualBox 환경이면 사용 불가. 베어메탈 NVIDIA 호스트라면
    # 아래 deploy 블록 주석 해제 + nvidia-container-toolkit 설치 필요.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ollama-pull:
    # 1회성 init: ollama 가 가동되면 모델을 받고 종료한다.
    # docker compose up 후 'docker compose logs ollama-pull' 으로 진행률 확인 가능.
    image: ollama/ollama:0.3.10
    container_name: aiops-ollama-pull
    entrypoint: /bin/sh
    command: >
      -c "
        echo '[ollama-pull] waiting for ollama server to be ready...';
        until ollama list >/dev/null 2>&1; do sleep 2; done;
        echo '[ollama-pull] pulling ${OLLAMA_MODEL:-qwen2.5:3b}';
        ollama pull ${OLLAMA_MODEL:-qwen2.5:3b};
        echo '[ollama-pull] done';
      "
    environment:
      OLLAMA_HOST: ollama:11434
    depends_on:
      ollama:
        condition: service_started
    networks: [default]
    restart: "no"

  rl-stub:
    # Phase 4a: FastAPI 휴리스틱 스텁. Phase 4b 의 SAC 체크포인트가 있으면
    # ../04-rl/serve.py 를 대신 호출하도록 .env 의 RL_DECIDE_URL 만 바꾸면 됨.
    build:
      context: ../04a-rl-stub
      dockerfile: Dockerfile
    container_name: aiops-rl-stub
    environment:
      LOG_LEVEL: info
    networks: [default]
    restart: unless-stopped

  n8n:
    <<: *n8n-common
    container_name: aiops-n8n
    ports:
      - "0.0.0.0:5678:5678"
    environment:
      <<: *n8n-env
      N8N_HOST: ${N8N_HOST:-0.0.0.0}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
    depends_on:
      redis:
        condition: service_healthy

  n8n-worker:
    <<: *n8n-common
    container_name: aiops-n8n-worker
    command: ["worker"]
    depends_on:
      redis:
        condition: service_healthy
      n8n:
        condition: service_started

volumes:
  redis_data:
  n8n_data:
  qdrant_data:
  ollama_data:

networks:
  default:
    name: aiops-lab_default
  kind:
    external: true
    name: kind
