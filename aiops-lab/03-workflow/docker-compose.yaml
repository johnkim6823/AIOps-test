# Phase 3: n8n (Queue Mode) + Redis + Qdrant + Ollama
#
# n8n 은 main(REST/UI) + worker 2개 컨테이너로 분리하여 Queue Mode 시연.
# Redis 가 큐 백엔드. ollama-pull 은 1회성 init 컨테이너로 모델을 받아오고 종료.
#
# 네트워크 구성:
#   - compose 자체 네트워크: redis, qdrant, ollama, n8n*, ollama-pull 끼리 통신
#   - 외부 'kind' 네트워크: n8n / n8n-worker 만 attach. 'aiops-lab-control-plane'
#     호스트명으로 K8s API 직접 호출 가능. Phase 1 의 kind 클러스터가 떠있어야 함.
#
# 모든 서비스에 healthcheck + 보수적 메모리 제한 설정 — VM 12GB 안에서 안정 동작.

name: aiops-lab

# 공통 logging 옵션 — 디스크 폭주 방지 (compose 의 default driver=json-file)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-n8n-common: &n8n-common
  image: n8nio/n8n:1.61.0
  environment: &n8n-env
    GENERIC_TIMEZONE: ${TIMEZONE:-Asia/Seoul}
    EXECUTIONS_MODE: queue
    QUEUE_BULL_REDIS_HOST: redis
    QUEUE_BULL_REDIS_PORT: 6379
    N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-please-change-me-32-chars-or-more}
    # Lab 편의: 첫 번째 사용자 회원가입 절차 스킵 (운영에서는 제거)
    N8N_USER_MANAGEMENT_DISABLED: "true"
    N8N_DIAGNOSTICS_ENABLED: "false"
    N8N_HIRING_BANNER_ENABLED: "false"
    N8N_RUNNERS_ENABLED: "true"
    N8N_LOG_LEVEL: info
    KUBECONFIG: /home/node/.kube/config
    SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
    SLACK_CHANNEL: ${SLACK_CHANNEL:-#alerts}
    SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
    OLLAMA_BASE_URL: http://ollama:11434
    OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    QDRANT_URL: http://qdrant:6333
    RL_DECIDE_URL: ${RL_DECIDE_URL:-http://rl-stub:8000/decide}
    K8S_API_URL: ${K8S_API_URL:-https://aiops-lab-control-plane:6443}
    K8S_TOKEN: ${K8S_TOKEN:-}
  volumes:
    - n8n_data:/home/node/.n8n
    - ./n8n-kubeconfig:/home/node/.kube/config:ro
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - default
    - kind
  logging: *default-logging
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    container_name: aiops-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - redis_data:/data
    networks: [default]
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: aiops-qdrant
    ports:
      - "127.0.0.1:6333:6333"
    healthcheck:
      # Qdrant 의 /readyz 는 200 OK 또는 fail 반환 — wget --spider 로 충분
      test: ["CMD-SHELL", "wget -q --spider http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [default]
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.3.10
    container_name: aiops-ollama
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_KEEP_ALIVE: 24h
    healthcheck:
      # ollama API 의 /api/tags 가 200 이면 ready
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    volumes:
      - ollama_data:/root/.ollama
    networks: [default]
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 6G    # 7B 모델 적재 여유. 3B 는 2~3GB 면 충분
    restart: unless-stopped
    # GPU 사용 시 (베어메탈 + nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ollama-pull:
    # 1회성 init: ollama 가 ready 가 되면 모델을 받고 종료한다.
    image: ollama/ollama:0.3.10
    container_name: aiops-ollama-pull
    entrypoint: /bin/sh
    command: >
      -c "
        echo '[ollama-pull] waiting for ollama server...';
        until ollama list >/dev/null 2>&1; do sleep 2; done;
        if ollama list 2>/dev/null | awk '{print $$1}' | grep -qx '${OLLAMA_MODEL:-qwen2.5:3b}'; then
          echo '[ollama-pull] model ${OLLAMA_MODEL:-qwen2.5:3b} already present; skip';
        else
          echo '[ollama-pull] pulling ${OLLAMA_MODEL:-qwen2.5:3b}';
          ollama pull ${OLLAMA_MODEL:-qwen2.5:3b};
        fi;
        echo '[ollama-pull] done';
      "
    environment:
      OLLAMA_HOST: ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks: [default]
    logging: *default-logging
    restart: "no"

  rl-stub:
    build:
      context: ../04a-rl-stub
      dockerfile: Dockerfile
    container_name: aiops-rl-stub
    environment:
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8000/health\", timeout=2).status==200 else 1)'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [default]
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  n8n:
    <<: *n8n-common
    container_name: aiops-n8n
    ports:
      - "0.0.0.0:5678:5678"
    environment:
      <<: *n8n-env
      N8N_HOST: ${N8N_HOST:-0.0.0.0}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  n8n-worker:
    <<: *n8n-common
    container_name: aiops-n8n-worker
    command: ["worker"]
    depends_on:
      redis:
        condition: service_healthy
      n8n:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  redis_data:
  n8n_data:
  qdrant_data:
  ollama_data:

networks:
  default:
    name: aiops-lab_default
  kind:
    external: true
    name: kind
