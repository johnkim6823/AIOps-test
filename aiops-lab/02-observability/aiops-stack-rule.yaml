# AIOps 스택 자체 health 모니터링 룰.
# 자동 진단 시스템이 죽어 있는데 OOMKilled 가 발생하면 운영자가 알아채야 함.
# n8n / ollama / rl-stub 가 호스트에 있어 ServiceMonitor 직접 안 됨 →
# 호스트에 떠있는 blackbox-exporter 가 있다면 probe_success 로 감지하는 식이
# 이상적. 본 lab 에서는 kube-state-metrics + custom alert 만 정의.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: aiops-stack-health
  namespace: monitoring
  labels:
    aiops-lab: "true"
    release: prom-stack
spec:
  groups:
    - name: aiops.stack.health
      interval: 30s
      rules:
        # 같은 Pod 가 5분 안에 3회 이상 OOMKill 되면 자동 조치가 미작동중일 가능성
        - alert: AIOpsRemediationStuck
          expr: |
            increase(kube_pod_container_status_restarts_total[5m]) >= 3
            and on(namespace, pod, container)
            kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
          for: 1m
          labels:
            severity: warning
            team: aiops
            alert_kind: aiops-system
          annotations:
            summary: "AIOps remediation may be stuck — {{ $labels.namespace }}/{{ $labels.pod }} restarted 3+ times in 5m"
            description: |
              Pod {{ $labels.namespace }}/{{ $labels.pod }} 가 5분 내 3회 이상 OOMKilled 로
              재시작되고 있다. AIOps 워크플로우가 작동 중이라면 이미 patch 가 되었어야 한다.
              n8n 워크플로우 실행 이력 / Slack 채널을 확인할 것.

        # PrometheusRule 자체가 evaluation 에 실패하면 조용한 실패가 됨
        - alert: AIOpsPrometheusRuleFailing
          expr: |
            increase(prometheus_rule_evaluation_failures_total{rule_group=~"aiops.*"}[10m]) > 0
          for: 5m
          labels:
            severity: warning
            team: aiops
            alert_kind: aiops-system
          annotations:
            summary: "AIOps PrometheusRule has evaluation failures"
            description: |
              {{ $labels.rule_group }} 룰 그룹의 evaluation 실패가 10분 동안 있었다.
              kube-state-metrics 메트릭 부재 또는 PromQL 오타 가능. Prometheus UI →
              Status → Rules 에서 에러 메시지 확인.

        # Alertmanager 가 받은 알람을 처리하지 못하고 적체
        - alert: AIOpsAlertmanagerNotDelivering
          expr: |
            sum(rate(alertmanager_notifications_failed_total{integration="webhook"}[5m])) > 0
          for: 3m
          labels:
            severity: warning
            team: aiops
            alert_kind: aiops-system
          annotations:
            summary: "Alertmanager webhook (n8n) delivery failing"
            description: |
              Alertmanager → n8n webhook 호출이 실패하고 있다. n8n 컨테이너가
              떠있는지, K8S_API_URL 이 도달 가능한지 확인.
