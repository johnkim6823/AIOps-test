# Victim Deployment — limits.memory 가 의도적으로 작아서 OOMKilled 발생.
#
# 일부러:
#   - replicas 1 (단순한 시나리오)
#   - limits.memory: 128Mi  → app.py 가 1~2분 안에 OOM
#   - requests.memory: 64Mi (스케줄링용)
#   - imagePullPolicy: IfNotPresent — kind load docker-image 로 노드 캐시
#     에 미리 적재된 로컬 이미지 사용
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: prod
  labels:
    app: payment-api
    aiops-lab/victim: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
        aiops-lab/victim: "true"
      annotations:
        # promtail 이 자동으로 모든 pod 로그를 수집하지만, 명시적으로 라벨
        prometheus.io/scrape: "false"
    spec:
      # Pod-level SecurityContext: non-root, no privilege escalation
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: payment-api:demo
          imagePullPolicy: IfNotPresent
          # Container-level SecurityContext: read-only fs, drop all caps
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: "v2.4.1"
            - name: BATCH_MIN
              value: "50"
            - name: BATCH_MAX
              value: "100"
            - name: BATCH_INTERVAL_SEC
              value: "1.5"
            - name: HEALTH_PORT
              value: "8080"
          # 메모리 부족 도달 시 readinessProbe 가 실패 → 트래픽에서 제외 →
          # 곧이어 cgroup 이 SIGKILL → OOMKilled. 운영의 cascading-failure 흐름 시연.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            # OOM 직전엔 healthz 도 503 → kubelet 이 restart. PrometheusRule 의
            # last_terminated_reason=OOMKilled 메트릭은 cgroup OOM 이 먼저 떨어졌을 때만
            # 1 이 되므로, 이 livenessProbe 가 먼저 trigger 되면 reason 이 다를 수 있다.
            # 시연에서 OOMKilled 가 안정적으로 잡히게 하려면 livenessProbe 를 삭제하거나
            # failureThreshold 를 매우 크게 하면 된다.
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      restartPolicy: Always
      terminationGracePeriodSeconds: 10
---
# Service: 후속 통신용 (Phase 6 워크플로우가 'kubectl get svc' 등으로 참조 가능).
# 메모리 OOM 시연 자체에는 트래픽이 필요 없지만, 실 운영 흉내를 위해 함께 만든다.
apiVersion: v1
kind: Service
metadata:
  name: payment-api
  namespace: prod
  labels:
    app: payment-api
spec:
  selector:
    app: payment-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP
