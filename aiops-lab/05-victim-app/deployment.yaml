# Victim Deployment — limits.memory 가 의도적으로 작아서 OOMKilled 발생.
#
# 일부러:
#   - replicas 1 (단순한 시나리오)
#   - limits.memory: 128Mi  → app.py 가 1~2분 안에 OOM
#   - requests.memory: 64Mi (스케줄링용)
#   - imagePullPolicy: IfNotPresent — kind load docker-image 로 노드 캐시
#     에 미리 적재된 로컬 이미지 사용
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: prod
  labels:
    app: payment-api
    aiops-lab/victim: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
        aiops-lab/victim: "true"
      annotations:
        # promtail 이 자동으로 모든 pod 로그를 수집하지만, 명시적으로 라벨
        prometheus.io/scrape: "false"
    spec:
      containers:
        - name: api
          image: payment-api:demo
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_VERSION
              value: "v2.4.1"
            - name: BATCH_MIN
              value: "50"
            - name: BATCH_MAX
              value: "200"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      restartPolicy: Always
---
# Service: 후속 통신용 (Phase 6 워크플로우가 'kubectl get svc' 등으로 참조 가능).
# 메모리 OOM 시연 자체에는 트래픽이 필요 없지만, 실 운영 흉내를 위해 함께 만든다.
apiVersion: v1
kind: Service
metadata:
  name: payment-api
  namespace: prod
  labels:
    app: payment-api
spec:
  selector:
    app: payment-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP
