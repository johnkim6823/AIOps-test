# kind 클러스터 정의 — control-plane 1 + worker 2
#
# - extraPortMappings: 호스트(VM) 의 80/443 을 control-plane 컨테이너로 매핑.
#   ingress-nginx 가 이 노드 포트로 LoadBalancer 역할을 대신함.
# - kubeadm patches: NodePort 범위를 30000-32767 기본 그대로 두되, ingress
#   를 위해 control-plane 에 ingress-ready=true 라벨을 붙여 ingress-nginx
#   admission/controller 가 그 노드로 스케줄되게 함.
#
# 변경 사유가 있으면 여기서만 고치고 bootstrap.sh 는 그대로 둘 것.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: aiops-lab
nodes:
  - role: control-plane
    image: kindest/node:v1.30.0
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        listenAddress: "0.0.0.0"
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        listenAddress: "0.0.0.0"
        protocol: TCP
  - role: worker
    image: kindest/node:v1.30.0
  - role: worker
    image: kindest/node:v1.30.0
networking:
  apiServerAddress: "0.0.0.0"
  apiServerPort: 6443
  # n8n (host) 가 K8s API 호출 시 host.docker.internal 을 쓰는 것보다
  # kubeconfig server URL 을 그대로 사용하는 것이 단순. n8n 컨테이너는
  # host network mode 로 띄울 예정.
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"
